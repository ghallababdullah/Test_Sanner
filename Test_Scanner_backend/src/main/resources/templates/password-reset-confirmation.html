<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пароль изменён</title>
    <style>
        body { margin: 0; padding: 0; background: #f6f2ea; font-family: "Segoe UI", Arial, sans-serif; color: #1f2933; }
        .wrapper { max-width: 620px; margin: 24px auto; background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 28px rgba(31,78,95,0.12); }
        .header { background: linear-gradient(135deg, #2e7d32, #55b36a); color: #fff; padding: 36px 28px; }
        .content { padding: 32px 28px; line-height: 1.7; font-size: 15px; }
        .notice { background: #eefaf0; border: 1px solid #b9e2c0; border-radius: 12px; padding: 16px; margin: 20px 0; }
        .warning { background: #fff5db; border: 1px solid #f3d37b; color: #785a00; border-radius: 12px; padding: 16px; margin-top: 20px; }
        .footer { padding: 20px 28px 28px; color: #6b7280; font-size: 13px; text-align: center; border-top: 1px solid #eef2f4; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1>Пароль успешно изменён</h1>
        <p>Доступ к аккаунту обновлён</p>
    </div>
    <div class="content">
        <p>Здравствуйте, <strong th:text="${name} ?: 'пользователь'">пользователь</strong>.</p>
        <div class="notice">
            Пароль для вашего аккаунта в системе <strong>СканПроверка</strong> был успешно изменён.
        </div>
        <div class="warning">
            Если это были не вы, срочно смените пароль ещё раз и проверьте безопасность своей почты.
        </div>
    </div>
    <div class="footer">Это автоматическое письмо от СканПроверка.</div>
</div>
</body>
</html>
