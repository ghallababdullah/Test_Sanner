server:
  port: 8080
  address: 0.0.0.0

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Test_Scanner_backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scanner_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:051020}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        connection:
          isolation: 2

  jwt:
    secret:
      string: abdullah4u12345abdullah4u12345abdullah4u12345
    expiration:
      time: 86400000

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:scanner}
    password: ${RABBIT_PASS:scanner_pass}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 3s
          max-attempts: 3
          multiplier: 2.0

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:your_mail_username}
    password: ${MAIL_PASSWORD:your_mail_password}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            enable: true
          starttls:
            enable: false
            required: false

app:
  mail:
    from: ${APP_MAIL_FROM:no-reply@skanproverka.local}
    name: ${APP_MAIL_NAME:СканПроверка}
  site:
    company-name: ${APP_SITE_COMPANY_NAME:СканПроверка}
    support-email: ${APP_SUPPORT_EMAIL:${MAIL_USERNAME:your_mail_username}}
    partnership-email: ${APP_PARTNERSHIP_EMAIL:${MAIL_USERNAME:your_mail_username}}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  backend:
    public-base-url: ${BACKEND_PUBLIC_BASE_URL:http://localhost:8080}
  scan:
    storage:
      root-dir: ${SCAN_STORAGE_ROOT:./storage/scans}
      copy-ocr-artifacts: ${SCAN_COPY_OCR_ARTIFACTS:true}
      python-output-root: ${PYTHON_OCR_OUTPUT_ROOT:../Python_CV_OCR/output}
    messaging:
      exchange: ${SCAN_EXCHANGE:scan.exchange}
      routing-key: ${SCAN_REQUEST_ROUTING_KEY:scan.ocr.requested}
      request-queue: ${SCAN_REQUEST_QUEUE:scan.ocr.request.queue}
      result-routing-key: ${SCAN_RESULT_ROUTING_KEY:scan.ocr.completed}
      result-queue: ${SCAN_RESULT_QUEUE:scan.ocr.result.queue}
