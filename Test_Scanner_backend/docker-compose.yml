services:

  postgres:
    image: postgres:16
    container_name: scanner-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-scanner_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-051020}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-scanner_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: scanner-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-scanner}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-scanner_pass}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
